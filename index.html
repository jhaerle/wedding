<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Website under construction</title>
  <style>
    /* ---------------------------------------------------------
     FONTS
     Fichiers fournis par le client, à conserver dans le même
     dossier que ce fichier HTML (ou à adapter le chemin "src").
     --------------------------------------------------------- */
    @font-face {
      font-family: "EB Garamond";
      src: url("assets/EBGaramond-VariableFont_wght.ttf") format("truetype-variations"),
        url("assets/EBGaramond-VariableFont_wght.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "EB Garamond";
      src: url("assets/EBGaramond-Italic-VariableFont_wght.ttf") format("truetype-variations"),
        url("assets/EBGaramond-Italic-VariableFont_wght.ttf") format("truetype");
      font-weight: 400 700;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "IM Fell English";
      src: url("assets/IMFellEnglish-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "IM Fell English";
      src: url("assets/IMFellEnglish-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --navy: #014b71;
      /* fond, couleur exacte relevée sur la maquette */
      --white: #ffffff;
      /* titre */
      --muted: #80a5b8;
      /* sous-titre, couleur exacte relevée sur la maquette */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--navy);
      overflow: hidden;
      position: relative;
    }

    .frame {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
    }

    /* Logo — D_J_Logomark_Beige.svg */
    .logo {
      position: absolute;
      top: max(44px, env(safe-area-inset-top, 0px) + 28px);
      left: clamp(24px, 5vw, 64px);
      width: 76px;
      height: auto;
      z-index: 3;
    }

    /* Illustrations florales — Illu_Fleurs-04.svg / Illu_Fleurs4.svg
     Les fichiers sources n'ont pas de couleur définie (noir par défaut) :
     le filtre ci-dessous les éclaircit pour qu'elles se détachent
     subtilement du fond bleu nuit, comme sur la maquette.
     -> à remplacer par un recolorage natif du SVG si possible côté dev. */
    .florals {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .florals img {
      position: absolute;
      filter: invert(1);
      opacity: .14;
    }

    .corner-tr {
      top: -8%;
      right: -6%;
      width: min(42vw, 520px);
    }

    .corner-tr.small {
      top: 6%;
      right: 14%;
      width: min(16vw, 190px);
      opacity: .10;
    }

    .corner-bl {
      bottom: -10%;
      left: -7%;
      width: min(42vw, 520px);
    }

    .corner-bl.small {
      bottom: 10%;
      left: 15%;
      width: min(16vw, 190px);
      opacity: .10;
    }

    /* Texte principal */
    .content {
      position: relative;
      z-index: 2;
      max-width: 720px;
      padding: 0 clamp(28px, 8vw, 120px);
    }

    h1 {
      margin: 0;
      font-family: "IM Fell English", serif;
      font-style: italic;
      font-weight: 400;
      color: var(--white);
      font-size: clamp(28px, 4.6vw, 52px);
      line-height: 1.15;
    }

    p.sub {
      margin: 16px 0 0 2px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      font-weight: 400;
      color: var(--muted);
      font-size: clamp(16px, 1.9vw, 24px);
    }

    @media (max-width: 640px) {
      .corner-tr {
        top: -8%;
        right: -18%;
        width: 78vw;
      }

      .corner-bl {
        bottom: -10%;
        left: -20%;
        width: 78vw;
      }

      .corner-tr.small,
      .corner-bl.small {
        display: none;
      }

      .logo {
        width: 58px;
      }
    }
  </style>
</head>

<body>
  <div class="frame">

    <img class="logo" src="assets/D_J_Logomark_Beige.svg" alt="Monogramme D &amp; J">

    <div class="florals" aria-hidden="true">
      <img class="corner-tr" src="assets/Illu_Fleurs-04.svg" alt="">
      <img class="corner-tr small" src="assets/Illu_Fleurs4.svg" alt="">
      <img class="corner-bl" src="assets/Illu_Fleurs4.svg" alt="">
      <img class="corner-bl small" src="assets/Illu_Fleurs-04.svg" alt="">
    </div>

    <div class="content">
      <h1>Website under construction</h1>
      <p class="sub">Come back soon for more info</p>
    </div>

  </div>
</body>

</html>
